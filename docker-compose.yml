services:

  # ============================================================================
  # llama.cpp — OpenAI-compatible LLM inference
  # Listens on host port HOST_PORT (default 8181)
  # Run ./init_models.sh once to download the GGUF files before starting.
  # Build: docker compose build model
  # ============================================================================
  model:
    image: ${LLAMA_CPP_IMAGE:-clawbody-llama-cpp:cuda13-sm121}
    build:
      context: .
      dockerfile: Dockerfile.llama-cpp
      args:
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-nvidia/cuda:13.0.0-devel-ubuntu24.04}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-121}
    container_name: ${CONTAINER_NAME:-llama-cpp-model}
    runtime: nvidia
    ipc: host
    shm_size: 16g
    mem_limit: ${HOST_RAM_LIMIT:-96g}
    memswap_limit: ${HOST_RAM_LIMIT:-96g}
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${LOCAL_MODEL_PATH:-~/models}:/models:ro
    ports:
      - "${HOST_PORT:-8181}:8080"
    command: >-
      -m /models/${MODEL_FILE:-unsloth/Qwen3.5-35B-A3B-GGUF/Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf}
      --mmproj /models/${MMPROJ_FILE:-unsloth/Qwen3.5-35B-A3B-GGUF/mmproj-F16.gguf}
      --alias ${MODEL_ALIAS:-unsloth/Qwen3.5-35B-A3B}
      --host 0.0.0.0
      --port 8080
      -c ${CTX_SIZE:-131072}
      -np ${PARALLEL:-4}
      -ngl ${N_GPU_LAYERS:-999}
      -b ${BATCH_SIZE:-2048}
      -ub ${UBATCH_SIZE:-512}
      --cache-type-k ${CACHE_TYPE_K:-q4_0}
      --cache-type-v ${CACHE_TYPE_V:-q4_0}
      --cont-batching
      --flash-attn on
      --metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 90s

  # ============================================================================
  # speaches — local STT (faster-whisper) + TTS (Kokoro) via OpenAI Realtime API
  # Listens on host port SPEACHES_PORT (default 8233)
  # Reaches llama.cpp at localhost:HOST_PORT via host networking
  # To run speaches on a separate machine (kyber), just update
  # CHAT_COMPLETION_BASE_URL in .envrc to http://kyber:8181/v1 and move this
  # service to kyber's docker-compose.yml.
  # ============================================================================
  speaches:
    # Local build — ctranslate2 compiled from source with CUDA on aarch64.
    # The official ghcr.io image ships a CPU-only ctranslate2 PyPI wheel for
    # aarch64 (~16 MB, no cuBLAS/cuDNN), making GPU inference impossible.
    # This Dockerfile rebuilds ctranslate2 with -DWITH_CUDA=ON -DWITH_CUDNN=ON
    # (sm_121, CUDA 13.0) and also replaces onnxruntime → onnxruntime-gpu.
    # Build:  docker compose build speaches   (~20-30 min first time, cached after)
    image: ${SPEACHES_IMAGE:-clawbody-speaches:cuda13-sm121}
    build:
      context: .
      dockerfile: Dockerfile.speaches
      args:
        CUDA_VERSION: ${CUDA_VERSION:-13.0.0}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-121}
        SPEACHES_VERSION: ${SPEACHES_VERSION:-v0.9.0-rc.3}
    container_name: speaches
    runtime: nvidia
    network_mode: host
    #depends_on:
    #  model:
    #    condition: service_healthy
    environment:
      # LLM backend — speaches forwards Realtime API chat turns here.
      # With host networking this is always localhost; update if vLLM moves to kyber.
      CHAT_COMPLETION_BASE_URL: ${CHAT_COMPLETION_BASE_URL:-http://localhost:${HOST_PORT:-8181}/v1}
      CHAT_COMPLETION_API_KEY: ${CHAT_COMPLETION_API_KEY:-dummy}

      # Whisper STT — GPU inference via ctranslate2 built with CUDA support.
      # float16 gives full Tensor Core utilisation on the GB10 Blackwell GPU.
      # (Previously forced to cpu/int8 because the upstream aarch64 wheel had
      # no CUDA support — no longer needed with this custom build.)
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16

      # Pre-load models at startup to avoid cold-start on first request
      PRELOAD_MODELS: "${SPEACHES_STT_MODEL:-Systran/faster-distil-whisper-small.en},${SPEACHES_TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}"

      # Host speaches binds to and also uses for its own internal loopback calls.
      # MUST match SPEACHES_HOST in your .envrc.
      #
      # Why not "0.0.0.0"?
      #   speaches <=v0.8.x constructs its internal completion-client URL as
      #   http://{UVICORN_HOST}:{UVICORN_PORT}/v1.  On aarch64 Linux, connecting
      #   to 0.0.0.0 is not silently routed to 127.0.0.1 (unlike x86), so all
      #   speaches→speaches calls fail.  Using the real hostname/IP means the
      #   address is valid for both binding and connecting.
      UVICORN_HOST: "${SPEACHES_HOST:-localhost}"

      # Port speaches binds to (host networking)
      UVICORN_PORT: "${SPEACHES_PORT:-8233}"

      # Required to fix a bug in speaches <=v0.8.x where the transcription
      # client is created with base_url=f"{loopback_host_url}/v1" without
      # guarding against loopback_host_url being None.  Without this, the
      # OpenAI SDK resolves "None/v1" relative to the ASGI transport base URL
      # ("http://test/v1"), producing the broken URL
      # "http://test/v1/None/v1/audio/transcriptions" → 404.
      # With this set, speaches routes transcription via its own HTTP endpoint
      # instead of in-process ASGI transport, which works correctly.
      LOOPBACK_HOST_URL: "http://${SPEACHES_HOST:-localhost}:${SPEACHES_PORT:-8233}"

      # Uncomment to require an API key on the speaches endpoint
      # API_KEY: ${SPEACHES_API_KEY:-}
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:${SPEACHES_PORT:-8233}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  hf-hub-cache:
